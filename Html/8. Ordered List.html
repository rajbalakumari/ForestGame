8. Ordered List
<!DOCTYPE html>
<html>
<head>
    <title>Ordered List</title>
</head>
<body>

    <h1>Programming Languages</h1>

    <ol>
        <li>Java</li>
        <li>Python</li>
        <li>C</li>
        <li>JavaScript</li>
    </ol>

</body>
</html>

Output:

Programming Languages

1. Java
2. Python
3. C
4. JavaScript
